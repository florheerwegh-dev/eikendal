# The Eikendal multiplayer server on Render (free). Render reads this file when you choose "New > Blueprint".
services:
  - type: web
    name: eikendal-mp
    runtime: python
    plan: free
    rootDir: server
    buildCommand: "true"
    startCommand: "python3 serve.py --no-browser"
    healthCheckPath: /health
  # The game itself, as a website on Render (the same files as on GitHub Pages)
  - type: web
    name: eikendal
    runtime: static
    buildCommand: "true"
    staticPublishPath: .
    headers:
      - path: /*.js
        name: Cache-Control
        value: no-cache
